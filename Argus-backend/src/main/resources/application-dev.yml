project:
  name: Argus-backend
  version: 1.0.0

server:
  port: 10001

spring:
  application:
    name: argus-service
  datasource:
    # 业务主库：MySQL 8.0+（用户/群组/文档/任务/问答记录等全部业务表）
    url: "jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:argus_rag}?useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true"
    username: ${DB_USERNAME:your-db-username}
    password: ${DB_PASSWORD:your-db-password}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # ──────────────────────────────────────────────
  # Spring AI Alibaba — DashScope 原生配置
  # ──────────────────────────────────────────────
  ai:
    model:
      chat: dashscope
      embedding: openai
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:your-dashscope-api-key}
      chat:
        options:
          model: qwen-plus
    openai:
      api-key: ${OPENAI_API_KEY:your-openai-compatible-api-key}
      base-url: ${OPENAI_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode}
      embedding:
        options:
          # 指定维度，确保与数据库表结构一致
          dimensions: 512
          model: text-embedding-v3
          # 单个输入超过模型 context length 时由 Ollama 截断，避免上传链路直接失败。
          truncate: true

    # 下面是 Ollama 相关配置，使用的话需要自己部署ollama对应的向量模型，然后放开spring-ai-starter-model-ollama，注释掉spring-ai-starter-model-openai
#    model:
#      chat: dashscope
#      embedding: ollama
#    dashscope:
#      api-key: ${DASHSCOPE_API_KEY:}
#      chat:
#        options:
#          model: glm-5
#    ollama:
#      base-url: http://localhost:11434
#      embedding:
#        options:
#          model: qllama/bge-small-zh-v1.5
#          # 单个输入超过模型 context length 时由 Ollama 截断，避免上传链路直接失败。
#          truncate: true



    # 向量存储（PGvector）——业务库迁移 MySQL 后，向量表保留在 PostgreSQL。
    # 检索参数（512 维 / HNSW / 余弦距离）由 VectorStoreConfiguration 手动装配，
    # 此处不再通过 spring.ai.vectorstore.pgvector 自动装配。

storage:
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:your-minio-access-key}
    secret-key: ${MINIO_SECRET_KEY:your-minio-secret-key}
    bucket: ${MINIO_BUCKET:argus-rag-documents}

argus:
  # 向量库（PostgreSQL + pgvector）：仅承载 vector_store 向量表，
  # 供 VectorStoreConfiguration 构建的 PgVectorStore 使用，与业务主库（MySQL）完全隔离。
  vector:
    datasource:
      url: "jdbc:postgresql://${VECTOR_DB_HOST:localhost}:${VECTOR_DB_PORT:5432}/${VECTOR_DB_NAME:argus_rag_vector}"
      username: ${VECTOR_DB_USERNAME:your-vector-db-username}
      password: ${VECTOR_DB_PASSWORD:your-vector-db-password}
      driver-class-name: org.postgresql.Driver
  rag:
    auth:
      jwt-secret: ${ARGUS_RAG_JWT_SECRET:change-me-to-a-32byte-secret-key}
      issuer: argus-rag
      access-token-expire-minutes: 30
      refresh-token-expire-days: 14
      # 仅开发环境兜底，生产环境仍应显式配置安全密钥。
      #    jwt-secret: ${ARGUS_RAG_JWT_SECRET:argus_rag-dev-jwt-secret-2026-04-20-32bytes}
      refresh-cookie-name: ARGUS_RAG_REFRESH_TOKEN
      refresh-cookie-secure: false
    dev-admin:
      username: ${ARGUS_RAG_DEV_ADMIN_USERNAME:your-admin-username}
      email: ${ARGUS_RAG_DEV_ADMIN_EMAIL:your-admin-email@example.com}
      display-name: ${ARGUS_RAG_DEV_ADMIN_DISPLAY_NAME:your-display-name}
      password: ${ARGUS_RAG_DEV_ADMIN_PASSWORD:your-admin-password}
      user-code: ${ARGUS_RAG_DEV_ADMIN_USER_CODE:your-admin-code}

elasticsearch:
  host: ${ES_HOST:localhost}
  port: ${ES_PORT:9200}
  scheme: ${ES_SCHEME:http}
  index-name: argus_rag_document_chunks

ingestion:
  chunking:
    target-tokens: 240
    max-tokens: 320
    overlap-tokens: 32
  vector:
    # 控制业务侧每次调用 VectorStore.add 的 chunk 数量，降低单次 Ollama embedding 请求压力。
    add-batch-size: 9

youcom:
  search:
    enabled: false
    api-key: ${YOUCOM_API_KEY:}
    top-k: 10
